<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>問題文からコードを想像する</title>
  <style>
    :root[data-theme="dark"] {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-2: #21262d;
      --text: #e6edf3;
      --muted: #8b949e;
      --line: #30363d;
      --accent: #2f81f7;
      --green: #3fb950;
      --green-bg: rgba(63, 185, 80, 0.18);
      --bad: #f85149;
      --bad-bg: rgba(248, 81, 73, 0.16);
      --code: #0d1117;
    }
    :root[data-theme="light"] {
      --bg: #ffffff;
      --panel: #f6f8fa;
      --panel-2: #eaeef2;
      --text: #1f2328;
      --muted: #57606a;
      --line: #d0d7de;
      --accent: #0969da;
      --green: #1a7f37;
      --green-bg: rgba(26, 127, 55, 0.12);
      --bad: #cf222e;
      --bad-bg: rgba(207, 34, 46, 0.1);
      --code: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .back, button, .portal-link {
      font: inherit;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 6px;
      text-decoration: none;
      min-height: 44px;
      padding: 8px 12px;
      cursor: pointer;
    }
    .back { display: inline-flex; align-items: center; }
    #taskButtons { display: flex; flex-wrap: wrap; gap: 8px; }
    button.is-on, .task-btn.is-on { border-color: var(--accent); background: rgba(47, 129, 247, 0.15); }
    .spacer { flex: 1; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    h2 { font-size: 16px; margin: 18px 0 8px; }
    h3 { font-size: 15px; margin: 16px 0 8px; }
    p { line-height: 1.65; }
    #app {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(320px, 1fr);
    }
    .statement, .work { min-height: 0; overflow: auto; }
    .statement { padding: 20px 22px 40px; border-right: 1px solid var(--line); }
    .work { padding: 16px 16px 48px; background: var(--bg); }
    .eyebrow, .minutes, .lead, .how, .progress, .slot-label { color: var(--muted); }
    .how { margin-top: 0; }
    .sentence { margin: 0 0 12px; padding: 2px 4px; border-radius: 4px; }
    .sentence.is-hit { background: var(--green-bg); }
    .sentence.is-miss { background: var(--bad-bg); }
    .signature, .example, .skeleton, .gutter, .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
    }
    .signature, .example, .skeleton {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      white-space: pre-wrap;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card h2 { margin-top: 0; }
    .slots { margin: 8px 0 12px; padding-left: 1.2em; }
    .slots li.is-done { color: var(--green); }
    .prompt { font-size: 17px; }
    .choice, .run-btn, .text-btn { display: block; width: 100%; text-align: left; margin-top: 8px; }
    .run-btn { text-align: center; border-color: var(--accent); }
    .run-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .run-bar .run-btn { width: auto; }
    .vars { margin: 8px 0; padding-left: 1.2em; }
    .text-btn { width: auto; margin-top: 10px; }
    .answer summary { cursor: pointer; font-weight: 600; padding: 6px 0; }
    .answer-notes { margin: 6px 0 10px; padding-left: 1.2em; }
    .answer-code { overflow-x: auto; white-space: pre; }
    button:disabled { opacity: 0.55; cursor: default; }
    .feedback { padding: 8px 10px; border-radius: 6px; }
    .feedback.is-ok, .ok-note, .report-line.is-ok { color: var(--green); }
    .feedback.is-bad, .report-line.is-bad { color: var(--bad); }
    .editor {
      display: grid;
      grid-template-columns: auto 1fr;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: var(--code);
      min-height: 220px;
    }
    .picker { display: flex; align-items: center; gap: 8px; font-size: 16px; }
    .picker select {
      font: inherit;
      font-size: 16px;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 6px;
      min-height: 44px;
      max-width: 62vw;
    }
    .gutter {
      margin: 0;
      padding: 10px 0;
      color: var(--muted);
      background: var(--panel-2);
      user-select: none;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .gutter button.line-no {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 16px;
      line-height: 1.45;
      height: calc(16px * 1.45);
      min-height: 0;
      padding: 0 8px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      text-align: right;
    }
    .gutter button.line-no.is-break { color: var(--bad); }
    .gutter button.line-no.is-now { background: rgba(47, 129, 247, 0.35); }
    .code {
      margin: 0;
      padding: 10px;
      border: 0;
      resize: vertical;
      min-height: 220px;
      background: var(--code);
      color: var(--text);
      line-height: 1.45;
      font-size: 16px;
    }
    .imagine-row { display: grid; gap: 4px; margin-top: 10px; }
    .imagine-prompt { font-size: 14px; }
    input[type="text"] {
      font: inherit;
      font-size: 16px;
      color: var(--text);
      background: var(--code);
      border: 1px solid var(--line);
      border-radius: 6px;
      min-height: 44px;
      padding: 8px 10px;
    }
    .portal-link { display: inline-flex; align-items: center; margin-top: 8px; }
    @media (max-width: 820px) {
      #app { display: block; }
      .statement, .work { overflow: visible; }
      .statement { border-right: 0; border-bottom: 1px solid var(--line); }
      body { height: auto; }
    }
  </style>
</head>
<body>
  <header>
    <a class="back" href="./index.html">ポータルへ戻る</a>
    <label class="picker">問題
      <select id="taskPick" aria-label="問題を選ぶ"></select>
    </label>
    <span class="spacer"></span>
    <button type="button" id="langJa">日本語</button>
    <button type="button" id="langEn">English</button>
    <button type="button" id="themeBtn">明るい画面</button>
  </header>
  <main id="app"></main>
  <script src="./kotlite.js"></script>
  <script src="./reading-lab-extra.js"></script>
  <script src="./reading-lab-answers.js"></script>
  <script src="./reading-lab.js"></script>
</body>
</html>
