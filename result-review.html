<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>結果を分析</title>
  <style>
    :root {
      --text: #1c1e21;
      --muted: #667085;
      --line: #e6e8ee;
      --card: #ffffff;
      --bg: #f5f6f8;
      --ink: #243044;
      --ok: #12805c;
      --ok-bg: #e7f6ef;
      --warn: #b54708;
      --bad: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header, button, select { font: inherit; }
    a.nav, button {
      color: var(--text);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      min-height: 44px;
      padding: 8px 12px;
    }
    a.nav { display: inline-flex; align-items: center; text-decoration: none; }
    button { cursor: pointer; }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 12px 20px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    main { max-width: 1080px; margin: 0 auto; padding: 24px 20px 48px; }
    h1 { margin: 0 0 4px; font-size: 28px; }
    h2 { margin: 0 0 12px; font-size: 16px; }
    .kicker { margin: 0; color: var(--muted); }
    .sub { color: #2458c5; font-size: 14px; }
    .tabs { display: flex; gap: 16px; margin: 20px 0; border-bottom: 1px solid var(--line); }
    .tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; }
    .tabs button.is-on { border-bottom-color: var(--ink); font-weight: 700; }
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; color: var(--muted); font-weight: 600; background: #f7f8fa; }
    th, td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    tr.task { cursor: pointer; }
    tr.task.is-on { background: #f3f7fb; }
    tr.task td:first-child { box-shadow: inset 3px 0 0 var(--ok); }
    tr.task.is-warn td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
    .lang { display: block; color: var(--muted); font-size: 12px; }
    .score-card { text-align: center; }
    .ring { width: 180px; height: 180px; margin: 8px auto; position: relative; }
    .ring svg { width: 100%; height: 100%; }
    .ring strong {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    .note { color: var(--muted); font-size: 13px; }
    .meta { display: flex; flex-wrap: wrap; gap: 18px; margin: 12px 0; }
    .meta span { display: block; color: var(--muted); font-size: 12px; letter-spacing: 0.04em; }
    .pill { display: inline-block; margin-top: 4px; padding: 4px 8px; border-radius: 8px; background: #f2f4f7; }
    .pill.ok { background: var(--ok-bg); color: var(--ok); }
    .stats { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; margin: 8px 0 16px; }
    .stats b { font-size: 28px; }
    .group { border-top: 1px solid var(--line); }
    .group > button {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 0;
      border-radius: 0;
      background: transparent;
      text-align: left;
    }
    .case { padding: 0 8px 8px 28px; color: var(--muted); }
    .case p { margin: 4px 0; }
    .ok { color: var(--ok); }
    .bad { color: var(--bad); }
    pre {
      white-space: pre-wrap;
      background: #1e1e1e;
      color: #e8e8e8;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.45;
      overflow: auto;
    }
    .view-switch { display: flex; gap: 8px; margin: 8px 0; }
    .view-switch button.is-on { background: var(--ink); color: #fff; }
    #timePane ol { margin: 0; padding-left: 1.2em; }
    #timePane li { margin: 8px 0; }
    @media (max-width: 820px) {
      .grid { display: block; }
      .score-card { margin-top: 12px; }
      main { padding: 16px 12px 32px; }
      button, a.nav {
        min-width: 0;
        min-height: 0;
        max-width: 100%;
        padding: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      a.nav { display: inline-block; line-height: normal; }
      .group > button > span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>
  <header>
    <a class="nav" href="./index.html">ポータルへ戻る</a>
    <a class="nav" href="./timed-auto.html">制限時間で解く</a>
    <a class="nav" href="./reading-lab.html">読解練習</a>
  </header>
  <main>
    <p class="kicker">結果レポート</p>
    <h1 id="screenName">練習セッション</h1>
    <p class="sub" id="screenWhen"></p>
    <div class="tabs">
      <button type="button" id="tabSummary" class="is-on">概要</button>
      <button type="button" id="tabTime">タイムライン</button>
    </div>
    <div id="summaryPane">
      <div class="grid">
        <section class="card">
          <h2>問題のまとめ</h2>
          <table>
            <thead>
              <tr><th>問題</th><th>使った時間</th><th>得点</th></tr>
            </thead>
            <tbody id="taskRows"></tbody>
          </table>
          <p class="note" id="emptyNote" hidden>まだ結果がありません。制限時間で解くを実行すると、ここに出ます。</p>
        </section>
        <section class="card score-card">
          <h2>合計点</h2>
          <div class="ring" id="ring" aria-hidden="true"></div>
          <p class="note">得点は、実行したサンプルの合格数です。隠しテストや計算量の採点はありません。</p>
        </section>
      </div>
      <section class="card" id="insight" hidden></section>
    </div>
    <div id="timePane" hidden>
      <section class="card">
        <h2>タイムライン</h2>
        <ol id="timeline"></ol>
      </section>
    </div>
  </main>
  <script src="./reading-lab-extra.js"></script>
  <script src="./reading-lab-answers.js"></script>
  <script>window.SKIP_READING_LAB_BOOT = true;</script>
  <script src="./reading-lab.js"></script>
  <script src="./result-review.js"></script>
  <script src="./pull-refresh.js"></script>
</body>
</html>
